{% extends 'base.html' %}
{% block content %}
<div class="card card-body confirm-card mx-auto text-center p-4">
  <span class="icon-chip warn mx-auto mb-3"><svg class="ic"><use href="#i-alert"/></svg></span>
  <h1 class="h4">Delete this record?</h1>
  <p class="text-muted">You are about to delete <strong class="text-body">{{ object }}</strong>. This cannot be undone.</p>
  <form method="post" class="d-flex justify-content-center gap-2">{% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a class="btn btn-outline-secondary" href="{% url back %}">Cancel</a>
  </form>
</div>
{% endblock %}
