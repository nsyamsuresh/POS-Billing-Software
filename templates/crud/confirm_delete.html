{% extends 'base.html' %}
{% block content %}
<h1 class="h4">Delete this record?</h1>
<p>You are about to delete <strong>{{ object }}</strong>. This cannot be undone.</p>
<form method="post">{% csrf_token %}
  <button class="btn btn-danger">Delete</button>
  <a class="btn btn-outline-secondary" href="{% url back %}">Cancel</a>
</form>
{% endblock %}
