{% extends 'base.html' %}
{% block title %}New return{% endblock %}
{% block content %}
<h1 class="h4 mb-3">New return</h1>
<form class="card card-body" method="get" style="max-width:480px">
  <label class="form-label">Bill number</label>
  <input class="form-control mb-3" name="q" placeholder="For example INV00012" autofocus>
  <div class="d-flex gap-2">
    <button class="btn btn-dark">Find bill</button>
    <a class="btn btn-outline-secondary" href="{% url 'return_list' %}">Cancel</a>
  </div>
</form>
{% endblock %}
