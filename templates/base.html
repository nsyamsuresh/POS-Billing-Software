<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}POS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">POS Billing</span>
  <div class="d-flex align-items-center gap-3 text-white">
    <span>{{ user.username }} ({{ user.role }})</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}
      <button class="btn btn-sm btn-outline-light">Log out</button>
    </form>
  </div>
</nav>
<div class="container-fluid">
  <div class="row">
    {% if user.is_admin_role %}
    <aside class="col-md-2 bg-white border-end min-vh-100 pt-3">
      <div class="nav flex-column">
        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
        <a class="nav-link" href="{% url 'pos' %}">Billing</a>
      </div>
    </aside>
    <main class="col-md-10 p-4">
    {% else %}
    <main class="col-12 p-4">
    {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
