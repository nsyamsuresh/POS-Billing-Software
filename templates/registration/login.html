<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh">
<div class="container" style="max-width:380px">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">POS Billing</h1>
    {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div>
      <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
      <button class="btn btn-dark w-100">Log in</button>
    </form>
  </div></div>
</div>
<script>document.querySelectorAll('input[name=username],input[name=password]').forEach(function(i){i.classList.add('form-control')});</script>
</body>
</html>
